[package]
name = "super-router-cli"
description = "The super-router-server binary: the Rust data plane, configured through environment variables."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
keywords = ["llm", "router", "server", "self-hosting", "cli"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "super-router-server"
path = "src/main.rs"

[dependencies]
super-router-contracts.workspace = true
super-router-router.workspace = true
super-router-server.workspace = true
super-router-store-memory.workspace = true
super-router-store-postgres.workspace = true
super-router-provider-openai.workspace = true
super-router-provider-anthropic.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
tokio-util.workspace = true
axum = "0.8"
async-trait.workspace = true
serde_json.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }

[lints]
workspace = true
