[package]
name = "super-router-campaign"
description = "Campaigns for Super Router as an extension: referral rebates and redeem codes that grant credits through the router's own grant call."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
publish = false
repository.workspace = true
homepage.workspace = true
keywords = ["llm", "router", "referral", "credits", "postgres"]
categories = ["database", "asynchronous"]
exclude = ["/tests"]
build = "build.rs"

[dependencies]
super-router-contracts.workspace = true
super-router-router.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "derive"] }
include_dir = "0.7"
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
uuid.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
getrandom = "0.2"

[dev-dependencies]
super-router-store-memory.workspace = true
tokio.workspace = true

[lints]
workspace = true
