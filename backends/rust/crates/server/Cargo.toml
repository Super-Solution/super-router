[package]
name = "super-router-server"
description = "HTTP API of the Super Router data plane as an axum router."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
super-router-contracts = { path = "../contracts" }
super-router-pricing = { path = "../pricing" }
super-router-router = { path = "../router" }
super-router-routing = { path = "../routing" }
axum = "0.8"
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
async-stream.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
bytes = "1"
tracing = "0.1"
http-body-util = "0.1"

[dev-dependencies]
super-router-store-memory = { path = "../store-memory" }
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["net", "io-util"] }

[lints]
workspace = true
