[package]
name = "super-router-provider-gemini"
description = "Google Gemini generateContent API adapter (Gemini API and Vertex AI)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords = ["gemini", "google", "llm", "streaming", "router"]
categories = ["api-bindings", "asynchronous"]
# Not published by the Publish crates workflow yet: a crate must exist on crates.io before it can have a trusted
# publisher, so its first version is published by hand (docs/CRATES-PUBLISHING.md, "First release"). Remove this line,
# add the crate back to PUBLISH_ORDER in scripts/check-crates-release.mjs and release the next version for all eleven.
publish = false

[dependencies]
super-router-contracts.workspace = true
super-router-sse.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde.workspace = true
serde_json.workspace = true
async-stream.workspace = true
futures-util.workspace = true

[dev-dependencies]
axum = "0.8"
bytes = "1"
tokio = { workspace = true, features = ["net"] }
super-router-dataplane-test = { path = "../dataplane-test" }

[lints]
workspace = true
