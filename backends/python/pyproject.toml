[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "super-router"
version = "0.2.0"
description = "Super Router data plane for Python: exact pricing, routing, reserve and settle, providers, an ASGI server and swappable storage."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SUPER SOLUTION LABS INC", email = "contact@supersolution.io" }]
keywords = ["ai", "routing", "billing", "metering", "asgi", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
super-router-server = "super_router.__main__:main"

[project.urls]
Repository = "https://github.com/Super-Solution/super-router"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]
http = ["httpx>=0.27"]
server = ["super-router[postgres,http]", "uvicorn>=0.30"]
dev = [
  "super-router[server]",
  "pytest>=8",
  "anyio>=4",
  "starlette>=0.37",
  "fastapi>=0.110",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
super_router = ["py.typed", "stores/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.10"
mypy_path = "src"
files = ["src"]
